name: Rivi Deployment

on: 
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using ssh
        uses: LuisEnMarroquin/setup-ssh-action@v2.0.0
        with:
          ORIGIN: 207.148.125.161
          SSHKEY: ${{ secrets.SSH_KEY }}
          NAME: production
          port: 22
          script: 
            cd /var/www/html/rivi.com.vn/
            git checkout main
            git pull
            composer i
            php artisan route:clear
            touch hungdeptrai.txt
