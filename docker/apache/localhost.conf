<VirtualHost *:80>
  ServerName partner.review-map.com
  ServerAlias www.partner.review-map
  ServerAdmin webmaster@review-map.com

  ProxyPassMatch ^/(.*\.php(/.*)?)$ fcgi://app:9000${DOCUMENT_ROOT}/

  DocumentRoot ${DOCUMENT_ROOT}

  ErrorLog ${APACHE_LOG_DIR}/error.log
  CustomLog ${APACHE_LOG_DIR}/access.log combined

  <Directory ${DOCUMENT_ROOT}>
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    DirectoryIndex index.php
  </Directory>
</VirtualHost>

